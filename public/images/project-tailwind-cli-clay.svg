<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="rgba(20,20,20,0.045)" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="1" stop-color="#E7E6E0" stop-opacity="0.95"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#1A1A1A" flood-opacity="0.20"/>
  </filter>
  <filter id="shadowSm" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1A1A1A" flood-opacity="0.22"/>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6EC1E4"/><stop offset="1" stop-color="#66D9D9"/></linearGradient>
</defs>
<rect width="1200" height="900" fill="#F5F4F0"/>
<rect width="1200" height="900" fill="url(#grid)"/>
<g filter="url(#shadow)">
    <rect x="150" y="250" width="520" height="360" rx="24" fill="#242424"  />
    <rect x="150" y="250" width="520" height="52" rx="24" fill="#333333"/>
    <circle cx="188" cy="276" r="8" fill="#F08A7E"/>
    <circle cx="212" cy="276" r="8" fill="#F2CE74"/>
    <circle cx="236" cy="276" r="8" fill="#9BD9A6"/>
    <text x="186" y="366" font-family="monospace" font-size="27" fill="#66D9D9">$ npx tailwindcss</text>
    <text x="186" y="416" font-family="monospace" font-size="27" fill="#EAEAEA">-i input.css -o</text>
    <text x="186" y="466" font-family="monospace" font-size="27" fill="#9BD9A6">output.css --watch</text>
    <rect x="186" y="510" width="20" height="34" rx="4" fill="#66D9D9"/>
  </g><g filter="url(#shadow)">
    <rect x="740" y="300" width="320" height="320" rx="26" fill="#FFFFFF"  />
    <rect x="770" y="330" width="150" height="20" rx="10" fill="rgba(20,20,20,0.14)"/>
    <rect x="770" y="368" width="200" height="14" rx="7" fill="rgba(20,20,20,0.09)"/>
    <rect x="770" y="408" width="220" height="70" rx="18" fill="url(#tg)" filter="url(#shadowSm)"/>
    <rect x="770" y="504" width="120" height="44" rx="22" fill="#6EC1E4"/>
    <circle cx="1000" cy="544" r="14" fill="#F08A7E"/>
    <circle cx="1040" cy="544" r="14" fill="#F2CE74"/>
    <circle cx="1080" cy="544" r="14" fill="#9BD9A6"/>
  </g>
<g>
    <rect x="64" y="60" width="52" height="11" rx="5.5" fill="#6EC1E4"/>
    <text x="64" y="128" font-family="Inter Tight, Arial Black, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="0.5" fill="#2B2B2B">TAILWIND CSS CLI WORKFLOW</text>
  </g>
<rect x="0" y="730" width="1200" height="170" fill="url(#fade)"/>
</svg>